services:
  db:
    image: supabase/postgres:15.1.1.78
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/InvestDashboard.WebAPI/Dockerfile
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Database=${POSTGRES_DB:-postgres};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT_SECRET:?Configure JWT_SECRET with at least 32 random bytes in .env}
      Storage__SupabaseUrl: ${SUPABASE_URL:?Configure SUPABASE_URL in .env}
      Storage__SupabaseApiKey: ${SUPABASE_PUBLISHABLE_KEY:?Configure SUPABASE_PUBLISHABLE_KEY in .env}
      Storage__SupabaseServiceRoleKey: ${SUPABASE_SERVICE_ROLE_KEY:?Configure SUPABASE_SERVICE_ROLE_KEY in .env}
      Storage__SupabaseInviteRedirectUrl: ${SUPABASE_INVITE_REDIRECT_URL:?Configure SUPABASE_INVITE_REDIRECT_URL in .env}
      MarketData__BrapiToken: ${BRAPI_API_TOKEN:-}
      Cors__AllowedOrigins__0: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_USE_MSW: "false"
        VITE_API_URL: /
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
