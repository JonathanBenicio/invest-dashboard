services:
  db:
    image: supabase/postgres:15.1.1.78
    container_name: invest-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  api:
    image: invest-api
    container_name: invest-api
    build:
      context: .
      dockerfile: src/InvestDashboard.WebAPI/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=postgres;Username=postgres;Password=postgres
    depends_on:
      - db
    restart: always

  frontend:
    image: invest-frontend
    container_name: invest-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_USE_MSW: "false"
        VITE_API_URL: "http://localhost:5000"
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: always

volumes:
  postgres_data:
