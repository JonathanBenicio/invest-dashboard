name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/InvestDashboard.slnx
      - run: dotnet test src/InvestDashboard.slnx --no-restore --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bunx msw init public --save
      - run: bun run build
        env:
          VITE_USE_MSW: "false"
          VITE_API_URL: /
      - run: bunx playwright install --with-deps chromium
      - run: bun run test
